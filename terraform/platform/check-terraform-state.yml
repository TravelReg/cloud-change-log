name: Check Terraform state access

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check-state:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Assume Terraform deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: eu-north-1
          allowed-account-ids: '820932217554'

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Connect to existing state
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET"
          terraform -chdir=terraform/platform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -reconfigure \
            -input=false \
            -lockfile=readonly

      - name: Confirm web service is in state
        run: |
          terraform -chdir=terraform/platform state list aws_ecs_service.web |
            grep -Fx 'aws_ecs_service.web'