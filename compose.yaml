services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ccl
      POSTGRES_USER: ccl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccl -d ccl"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ccl_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ccl:${POSTGRES_PASSWORD}@db:5432/ccl
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"

volumes:
  ccl_data: